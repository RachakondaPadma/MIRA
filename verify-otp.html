<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP | MIRA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0,183,255,0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(8,124,255,0.15),
                    transparent 30%
                ),
                #050b1f;

            color: white;
        }

        .card {
            width: 100%;

            max-width: 460px;

            margin: 20px;

            padding: 40px;

            background: rgba(10,20,48,0.9);

            border:
                1px solid
                rgba(0,183,255,0.25);

            border-radius: 22px;

            box-shadow:
                0 0 50px
                rgba(0,183,255,0.12);
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00d4ff
                );

            font-size: 24px;

            font-weight: 800;
        }

        h1 {
            text-align: center;

            font-size: 27px;

            margin: 0;
        }

        .subtitle {
            text-align: center;

            color: #8fa4c7;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        label {
            display: block;

            color: #dbe8ff;

            font-size: 14px;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border:
                1px solid
                rgba(143,164,199,0.25);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:focus {
            border-color: #00b7ff;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00b7ff
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }

        .error {
            display: block;

            color: #ff8b8b;

            background: rgba(255,70,70,0.1);

            border:
                1px solid
                rgba(255,70,70,0.3);
        }

        .success {
            display: block;

            color: #5ff0bd;

            background: rgba(0,220,150,0.1);

            border:
                1px solid
                rgba(0,220,150,0.3);
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            color: #00b7ff;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="logo">
        M
    </div>


    <h1>
        Verify OTP
    </h1>


    <p class="subtitle">
        Enter the 6-digit OTP sent to your Gmail address.
    </p>


    <form id="otpForm">

        <label for="otp">
            Enter OTP
        </label>

        <input
            type="text"
            id="otp"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            required
        >


        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
        >


        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >


        <button type="submit">
            Verify OTP & Reset Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="back">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

const otpForm =
    document.getElementById("otpForm");

const message =
    document.getElementById("message");


otpForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            sessionStorage.getItem("resetEmail");


        const otp =
            document.getElementById("otp")
            .value
            .trim();


        const newPassword =
            document.getElementById("newPassword")
            .value;


        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        if (!email) {

            message.className =
                "message error";

            message.textContent =
                "Session expired. Please request OTP again.";

            return;
        }


        if (otp.length !== 6) {

            message.className =
                "message error";

            message.textContent =
                "Please enter a valid 6-digit OTP.";

            return;
        }


        if (newPassword.length < 6) {

            message.className =
                "message error";

            message.textContent =
                "Password must contain at least 6 characters.";

            return;
        }


        if (newPassword !== confirmPassword) {

            message.className =
                "message error";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        message.className =
            "message";

        message.style.display =
            "block";

        message.textContent =
            "Verifying OTP...";


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            otp: otp,

                            new_password:
                                newPassword

                        })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                /*
                 * Update demo localStorage account
                 * so the changed password also works
                 * with our frontend login.
                 */

                const savedUser =
                    localStorage.getItem(
                        "miraUser"
                    );


                if (savedUser) {

                    const user =
                        JSON.parse(savedUser);

                    if (
                        user.email === email
                    ) {

                        user.password =
                            newPassword;

                        localStorage.setItem(
                            "miraUser",
                            JSON.stringify(user)
                        );

                    }

                }


                message.className =
                    "message success";

                message.textContent =
                    "Password reset successfully!";


                sessionStorage.removeItem(
                    "resetEmail"
                );


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);

            }

            else {

                message.className =
                    "message error";

                message.textContent =
                    data.message ||
                    "Invalid OTP.";

            }

        }

        catch (error) {

            message.className =
                "message error";

            message.textContent =
                "Cannot connect to backend.";

        }

    }
);

</script>

</body>

</html>
