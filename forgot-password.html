<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | MIRA</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0,183,255,0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(8,124,255,0.15),
                    transparent 30%
                ),
                #050b1f;
        }

        .auth-page {
            width: 100%;
            max-width: 460px;
            padding: 30px 20px;
        }

        .auth-card {
            background: rgba(10,20,48,0.88);

            border: 1px solid rgba(0,183,255,0.25);

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 0 50px rgba(0,183,255,0.12);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 58px;
            height: 58px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00d4ff
                );

            color: white;

            font-size: 24px;
            font-weight: 800;

            box-shadow:
                0 0 30px rgba(0,183,255,0.35);
        }

        .auth-header h1 {
            color: white;

            margin: 0;

            font-size: 28px;
        }

        .auth-header p {
            color: #8fa4c7;

            font-size: 14px;

            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #dbe8ff;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(143,164,199,0.25);

            background: rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #00b7ff;
        }

        .send-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00b7ff
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }

        .message.error {
            display: block;

            color: #ff8b8b;

            background: rgba(255,70,70,0.1);

            border: 1px solid rgba(255,70,70,0.3);
        }

        .message.success {
            display: block;

            color: #5ff0bd;

            background: rgba(0,220,150,0.1);

            border: 1px solid rgba(0,220,150,0.3);
        }

        .back-login {
            text-align: center;

            margin-top: 22px;
        }

        .back-login a {
            color: #00b7ff;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="logo-circle">
                M
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter your registered Gmail address.
                We'll send a verification OTP.
            </p>

        </div>


        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Registered Gmail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <button
                type="submit"
                class="send-btn"
            >
                📧 Send OTP
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="back-login">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>


<script>

const forgotForm =
    document.getElementById("forgotForm");

const message =
    document.getElementById("message");


forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();


        message.className = "message";

        message.style.display = "block";

        message.textContent =
            "Sending OTP...";


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/send-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                sessionStorage.setItem(
                    "resetEmail",
                    email
                );


                message.className =
                    "message success";

                message.textContent =
                    "OTP sent successfully to your Gmail.";


                setTimeout(function() {

                    window.location.href =
                        "verify-otp.html";

                }, 1000);

            }

            else {

                message.className =
                    "message error";

                message.textContent =
                    data.message ||
                    "Unable to send OTP.";

            }

        }

        catch (error) {

            message.className =
                "message error";

            message.textContent =
                "Cannot connect to backend. Start Flask server.";

        }

    }
);

</script>

</body>

</html>
