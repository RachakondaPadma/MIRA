<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MIRA</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0,183,255,0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(8,124,255,0.15),
                    transparent 30%
                ),
                #050b1f;
        }

        .auth-page {
            width: 100%;
            max-width: 460px;
            padding: 30px 20px;
        }

        .auth-card {
            background: rgba(10,20,48,0.88);

            border: 1px solid rgba(0,183,255,0.25);

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 0 50px rgba(0,183,255,0.12);

            backdrop-filter: blur(15px);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00d4ff
                );

            color: white;

            font-size: 24px;
            font-weight: 800;

            box-shadow:
                0 0 30px rgba(0,183,255,0.35);
        }

        .auth-logo h1 {
            margin: 0;
            color: white;
            font-size: 28px;
        }

        .auth-logo p {
            color: #8fa4c7;
            margin-top: 8px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #dbe8ff;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(143,164,199,0.25);

            background: rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #00b7ff;

            box-shadow:
                0 0 0 3px rgba(0,183,255,0.08);
        }

        .form-group input::placeholder {
            color: #7184a5;
        }

        .forgot-password {
            text-align: right;

            margin-top: -10px;

            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #00b7ff;

            text-decoration: none;

            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #00b7ff
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0,183,255,0.25);
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }

        .message.error {
            display: block;

            background: rgba(255,70,70,0.1);

            border: 1px solid rgba(255,70,70,0.3);

            color: #ff8b8b;
        }

        .message.success {
            display: block;

            background: rgba(0,220,150,0.1);

            border: 1px solid rgba(0,220,150,0.3);

            color: #5ff0bd;
        }

        .auth-link {
            text-align: center;

            margin-top: 22px;

            color: #8fa4c7;

            font-size: 14px;
        }

        .auth-link a {
            color: #00b7ff;

            text-decoration: none;

            font-weight: 600;
        }

        .back-home {
            text-align: center;

            margin-top: 18px;
        }

        .back-home a {
            color: #7184a5;

            text-decoration: none;

            font-size: 13px;
        }

        .back-home a:hover {
            color: #00b7ff;
        }

    </style>

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">

                <div class="logo-circle">
                    M
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue with MIRA
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login →
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                const password =
                    document.getElementById("password")
                    .value;


                const savedUser =
                    localStorage.getItem("miraUser");


                if (!savedUser) {

                    message.className =
                        "message error";

                    message.textContent =
                        "No account found. Please register first.";

                    return;
                }


                const user =
                    JSON.parse(savedUser);


                if (
                    email === user.email &&
                    password === user.password
                ) {

                    localStorage.setItem(
                        "miraLoggedIn",
                        "true"
                    );


                    message.className =
                        "message success";

                    message.textContent =
                        "Login successful!";


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 800);

                }

                else {

                    message.className =
                        "message error";

                    message.textContent =
                        "Incorrect email or password.";

                }

            }
        );

    </script>

</body>

</html>
